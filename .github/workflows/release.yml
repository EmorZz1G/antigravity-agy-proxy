name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run package

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Package Extension
        run: npx -y @vscode/vsce@^4.1.1 package --out antigravity-agy-proxy-${{ steps.version.outputs.VERSION }}.vsix

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Antigravity AGY Proxy ${{ github.ref_name }}
          draft: false
          files: antigravity-agy-proxy-${{ steps.version.outputs.VERSION }}.vsix
          generate_release_notes: true

      - name: Publish to VS Code Marketplace (Trusted Publishing / OIDC)
        run: npx -y @vscode/vsce@^4.1.1 publish --oidc --packagePath antigravity-agy-proxy-${{ steps.version.outputs.VERSION }}.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret not set; skipping Open VSX publish."
            exit 0
          fi
          npx -y ovsx publish antigravity-agy-proxy-${{ steps.version.outputs.VERSION }}.vsix
