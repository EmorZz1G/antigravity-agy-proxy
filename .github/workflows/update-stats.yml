name: Update Download Stats

on:
  schedule:
    # Run every 8 hours at 00:05 UTC, 08:05 UTC, and 16:05 UTC (00:05 CST)
    - cron: '5 0,8,16 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'site/data/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch-stats:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Open VSX, VS Marketplace, and GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/fetch-stats.mjs

      - name: Commit and push updated stats
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/stats.json site/data/badge.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No stats changes to commit."
            exit 0
          fi
          git commit -m "chore(stats): update download metrics [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger GitHub Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
